name: Bug report
description: Something in the build, the installer, or a running stack does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't file it here — see
        [SECURITY.md](../blob/main/SECURITY.md) for private reporting.

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen
      options:
        - install.sh
        - Image build (docker compose build)
        - Container start / JupyterLab won't come up
        - Inside a notebook (imports, pip install, model downloads)
        - GPU not being used
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands, starting from a clean clone if possible.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Build error, or `docker compose -p <project> logs jupyter`.
        Paste the error itself, not just the last line.
      render: shell

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        Please paste the output of:

        ```bash
        docker version --format '{{.Server.Version}}'
        docker compose version
        uname -srm
        nvidia-smi --query-gpu=name,driver_version --format=csv 2>/dev/null || echo "no GPU"
        ```
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your .env (redact anything sensitive)
      description: |
        Which knobs you changed — REQUIREMENTS_FILE, MOUNT_PATH, HOST_PORT,
        BIND_ADDR, USER_UID/USER_GID, COMPOSE_FILE.
        **Remove JUPYTER_PASSWORD_HASH and any credentials before pasting.**
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I rebuilt with `--build` after changing a requirements file
        - label: I checked the README's Troubleshooting section
