# CPU-only variant of docker-compose.yml.
#
# Identical to docker-compose.yml EXCEPT it omits the
# `deploy.resources.reservations.devices` nvidia-GPU block, so the stack starts
# on hosts with no NVIDIA GPU / Container Toolkit. The same CUDA-based image is
# used; TensorFlow / PyTorch / JAX simply fall back to CPU at runtime.
#
# This is a self-contained file selected via COMPOSE_FILE rather than a compose
# *override*: Compose cannot reliably clear a `reservations.devices` entry from a
# base file through merge (an empty list is ignored; `!reset`/`!override` on that
# path is rejected by current Compose), so the CPU config is spelled out in full.
#
# LOCKSTEP: keep every field below in sync with docker-compose.yml. The ONLY
# intended difference is the absence of the GPU device reservation.
#
# Usage (the installer writes COMPOSE_FILE=docker-compose.cpu.yml into .env when
# it detects no GPU; you can also select it explicitly):
#   COMPOSE_FILE=docker-compose.cpu.yml docker compose -p <project> up -d --build
services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      target: jupyter
      args:
        REQUIREMENTS_FILE: ${REQUIREMENTS_FILE:-requirements.txt}
        # Both must move together for a hash-checked build: uv resolves them in
        # one pass, so --require-hashes fails unless BOTH carry hashes.
        #   scripts/lock.sh -a
        #   REQUIREMENTS_FILE=requirements.lock JUPYTER_BASE_FILE=jupyter-base.lock \
        #   REQUIRE_HASHES=1 docker compose -p locked up -d --build
        JUPYTER_BASE_FILE: ${JUPYTER_BASE_FILE:-jupyter-base.txt}
        REQUIRE_HASHES: ${REQUIRE_HASHES:-0}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        UV_VERSION: ${UV_VERSION:-0.5.11}
        PIP_AUDIT_STRICT: ${PIP_AUDIT_STRICT:-0}
        # Tag by default, so a fresh clone builds without extra setup. A tag is
        # mutable — the same tag can be re-pushed under you, which quietly
        # defeats the pinning discipline everywhere else. For reproducible
        # builds pin the digest instead:
        #   scripts/pin-base.sh          # resolves and prints the digest
        #   BASE_IMAGE=nvidia/cuda@sha256:<digest>   # in .env
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04}
    ports:
      # 1:1 host↔container mapping so the URL JupyterLab prints in its log
      # matches the one the user actually opens. Both sides use HOST_PORT.
      # Default bind is loopback-only. Override BIND_ADDR=0.0.0.0 to expose
      # on all interfaces — only do this on a trusted network behind a real
      # auth proxy. JupyterLab on a public bind = arbitrary code execution.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8888}:${HOST_PORT:-8888}"
    volumes:
      - ${MOUNT_PATH:-./workspace}:/home/workspace
    environment:
      # When set, the entrypoint switches JupyterLab to hashed-password auth
      # and disables the auto-token. Required when BIND_ADDR is not 127.0.0.1.
      # Generate: python -c "from jupyter_server.auth import passwd; print(passwd())"
      JUPYTER_PASSWORD_HASH: ${JUPYTER_PASSWORD_HASH:-}
      # Port JupyterLab binds inside the container. Mirrors HOST_PORT so the
      # log banner shows the same port the user opens on the host.
      JUPYTER_PORT: ${HOST_PORT:-8888}
      # Writable prefix for libraries installed from inside a notebook
      # (`!pip install <lib>`). Lives on the bind-mounted workspace because
      # the rootfs is read_only, so installs survive a container restart and
      # can be wiped from the host with `rm -rf`. Set to the empty string to
      # disable in-notebook installs entirely.
      KEDULAB_USER_PREFIX: ${KEDULAB_USER_PREFIX-/home/workspace/.kedulab-packages}
      # Writable cache/dataset root for the ML frameworks. Without it,
      # nltk.download() / keras.datasets / tfds.load() hit the read-only rootfs
      # and fail, while HuggingFace and torch.hub downloads land in RAM-backed
      # tmpfs — counted against MEMORY_LIMIT and lost on every restart. The
      # entrypoint derives HF_HOME, TORCH_HOME, NLTK_DATA, KERAS_HOME,
      # TFDS_DATA_DIR, MPLCONFIGDIR and XDG_CACHE_HOME from this.
      # Set to the empty string to leave every framework on its own default.
      KEDULAB_CACHE_DIR: ${KEDULAB_CACHE_DIR-/home/workspace/.kedulab-cache}
      # Kept for lockstep with docker-compose.yml. Inert on a CPU-only host.
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES-}
    # Default /dev/shm of 64 MB is too small for PyTorch DataLoader workers
    # at scale; bump to a sensible default that user can override.
    shm_size: ${SHM_SIZE:-2gb}
    # PID 1 would otherwise be jupyter-lab, which does not reap orphans. Killed
    # kernels and notebook subprocesses then accumulate as zombies for the life
    # of the container. `init: true` puts a minimal reaper in front.
    init: true
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-16G}
          cpus: "${CPU_LIMIT:-8}"
        # No reservations.devices block: CPU-only. See docker-compose.yml for
        # the GPU reservation (and its GPU_COUNT knob) this file omits.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Root filesystem is read-only; the bind-mounted workspace is the only
    # persistent writable surface. JupyterLab runtime state goes to tmpfs
    # so a code-execution bug inside the container cannot drop a payload
    # onto the image rootfs.
    read_only: true
    # Every tmpfs carries an explicit size cap. tmpfs is RAM: an uncapped mount
    # defaults to half the host's memory, and those pages count against
    # MEMORY_LIMIT above — so a single large download into a cache dir could
    # OOM-kill the container instead of erroring. Framework caches are
    # redirected to the workspace mount (KEDULAB_CACHE_DIR), so these only need
    # to hold transient runtime state.
    tmpfs:
      - /tmp:size=${TMPFS_TMP_SIZE:-2g}
      - /home/jovyan/.jupyter:size=64m
      - /home/jovyan/.local:size=256m
      - /home/jovyan/.cache:size=${TMPFS_CACHE_SIZE:-1g}
      - /home/jovyan/.ipython:size=64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
