[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This project has no Python source — pyproject.toml exists for uv dep
# management only. Tell hatch to produce a wheel with no packages.
bypass-selection = true

[tool.uv]
# Reserved for future config (uv.lock generation strategy, index URLs).
