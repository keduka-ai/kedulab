# =============================================================================
# pyproject.toml — uv-native single-source dep declaration.
#
# Status (2026-05-27): SCAFFOLD. requirements*.txt files remain the canonical
# install source baked into the Docker image. This file mirrors them so they
# can be consumed by uv-native workflows (`uv sync --extra jupyter`) on the
# host without rebuilding the image. Future work: collapse requirements files
# into this file + uv.lock; update Dockerfile to `uv sync --frozen`.
#
# Pin policy mirrors requirements.txt: >=X.Y,<Z.0 per the global rule. Two
# user-intent narrowings carry through (`tensorflow <2.19`, `numpy <2.1`).
# =============================================================================

[project]
name = "init-docker"
version = "0.1.0"
description = "GPU JupyterLab launcher with per-stack pinned dependencies"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    # Cloud / Storage
    "azure-storage-blob>=12.24,<13.0",
    "azure-mgmt-storage>=21.2,<22.0",
    "boto3>=1.42,<2.0",
    # Deep Learning core (TF 2.18 pin is a user-intent narrowing)
    "tensorflow>=2.18,<2.19",
    "tensorflow-datasets>=4.9,<5.0",
    # PyTorch GPU + JAX GPU. torch 2.5–2.6.x bundles CUDA 12.4 wheels (matches
    # the cuda:12.4.1-cudnn-runtime base); torch 2.7+ moved to CUDA 12.8.
    # jax held on 0.4.x because 0.5+ needs ml_dtypes>=0.5 (conflicts with TF
    # 2.18's <0.5 ceiling). Co-install is fragile — see requirements.txt
    # comments for the rationale.
    "torch>=2.5,<2.7",
    "jax[cuda12]>=0.4.38,<0.5",
    "keras>=3.7,<4.0",
    "ml-dtypes>=0.4,<0.5",
    "transformers>=5.0,<6.0",  # CVE-2026-1839
    "datasets>=3.1,<4.0",
    # Numeric / Scientific (numpy <2.1 + ml-dtypes <0.5 are the TF 2.18.1 ceilings)
    "numpy>=1.26,<2.1",
    "pandas>=2.2,<3.0",
    "scipy>=1.14,<2.0",
    "scikit-learn>=1.6,<2.0",
    "scikit-image>=0.25,<1.0",
    "shapely>=2.0,<3.0",
    "albumentations>=1.4,<2.0",
    "imageio>=2.37,<3.0",
    "opencv-python>=4.11,<5.0",
    "pillow>=12.2,<13.0",       # CVE-2025-48379, CVE-2026-25990, CVE-2026-40192
    # Visualisation
    "matplotlib>=3.10,<4.0",
    "plotly>=5.24,<6.0",
    "seaborn>=0.13,<1.0",
    # LLM / RAG / agent stacks
    "langchain>=1.0,<2.0",
    # langchain-community stays on 0.4.x — no stable 1.x ever shipped and the
    # package is being sunset by maintainers (verified 2026-05-28 via PyPI).
    "langchain-community>=0.4,<1.0",
    # CVE-2025-68664 LangGrinch fix lives in core 1.x; floor bumped to 1.4 to
    # match what langchain-community 0.4.2 transitively requires.
    "langchain-core>=1.4,<2.0",
    "gradio>=6.12,<7.0",
    "bertviz>=1.4,<2.0",
    # Document / OCR / PDF
    "pypdf>=6.0,<7.0",
    "pdfplumber>=0.11,<1.0",
    "pdf2image>=1.17,<2.0",
    "pytesseract>=0.3.13,<1.0",
    "unstructured.pytesseract>=0.3.13,<1.0",
    # Audio / Video
    "soundfile>=0.13,<1.0",
    "pyaudio>=0.2.14,<1.0",
    "yt-dlp>=2026.1,<2027.0",
    "librosa>=0.11,<1.0",     # pulls numba/llvmlite; fits the numpy<2.1 window
    # NLP utilities
    "nltk>=3.9,<4.0",
    "num2words>=0.5,<1.0",
    # Django web stack
    "Django>=5.2,<7.0",
    "djangorestframework>=3.16,<4.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "djangorestframework-xml>=2.0,<3.0",
    "django-allauth>=65.15,<66.0",
    "django-axes>=8.0,<9.0",
    "django-countries>=7.6,<10.0",
    "django-crispy-forms>=2.6,<3.0",
    "crispy-tailwind>=1.0,<2.0",
    "django-debug-toolbar>=5.0,<8.0",
    "django-filter>=25.2,<27.0",
    "django-prometheus>=2.4,<3.0",
    "djoser>=2.3,<3.0",
    "drf-yasg>=1.21,<2.0",
    "dj-database-url>=3.0,<4.0",
    "gunicorn>=23.0,<26.0",
    "daphne>=4.2,<5.0",
    "channels>=4.3,<5.0",
    "psycopg2-binary>=2.9,<3.0",
    # Testing / dev tooling
    "pytest>=8.3,<10.0",
    "pytest-django>=4.12,<5.0",
    "debugpy>=1.8,<2.0",
    "flake8>=7.3,<8.0",
    "black[jupyter]>=26.0,<27.0",
    "nbdime>=4.0,<5.0",
    # Security-sensitive utility libs
    "bleach>=6.3,<7.0",
    "requests>=2.33,<3.0",
    "cryptography>=46.0.7,<47.0",  # CVE-2026-26007, CVE-2026-39892
    "oauthlib>=3.2,<4.0",
    # Web parsing / serialization
    "beautifulsoup4>=4.14,<5.0",
    "pyyaml>=6.0,<7.0",
    "Markdown>=3.10,<4.0",
    "pymdown-extensions>=10.21,<11.0",
    "latex2mathml>=3.80,<4.0",
    "pygments>=2.20,<3.0",
    # Async / control flow
    "nest-asyncio>=1.6,<2.0",
    "tenacity>=9.0,<10.0",
    "click>=8.3,<9.0",
    "blinker>=1.9,<2.0",
    "distro>=1.9,<2.0",
    "termcolor>=2.5,<3.0",
    # Build / native
    "cython>=3.0,<4.0",
    "munkres>=1.1,<2.0",
    # Observability / logging
    "python-logging-loki>=0.3,<1.0",
    "nvitop>=1.4,<2.0",
    # Misc
    "natsort>=8.4,<9.0",
]

[project.optional-dependencies]
# Always installed by Dockerfile.jupyter — separated so a `shell` build can omit.
jupyter = [
    "jupyterlab>=4.5,<5.0",   # CVE-2025-59842
    "ipykernel>=7.2,<8.0",
    "pip>=26.1,<27.0",        # uv venv doesn't seed pip; needed for in-notebook installs
]

# Multi-node training stack — adds ~1 GB. Opt-in via REQUIREMENTS_FILE.
distributed = [
    "ray[data,train,tune,serve]>=2.54,<3.0",
    "kubernetes>=31.0,<32.0",
    "kfp-pipeline-spec>=0.5,<1.0",
    "kfp-server-api>=2.4,<3.0",
    "grpcio-health-checking>=1.68,<2.0",
]

